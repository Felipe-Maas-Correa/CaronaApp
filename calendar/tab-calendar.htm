<!-- ══ TAB: CALENDÁRIO ══════════════════════════════════════ -->
<div id="tab-calendar" class="tab-panel">
  <div class="calendar-header">
    <span id="calendar-month-label" class="calendar-month-label">—</span>
    <div class="calendar-nav-btns">
      <button id="btn-today" class="btn-nav btn-today">Hoje</button>
      <button id="btn-prev-month" class="btn-nav">‹</button>
      <button id="btn-next-month" class="btn-nav">›</button>
    </div>
  </div>

  <div class="calendar-wrap">
    <div id="calendar-loading" class="calendar-loading" style="display:none">
      <div class="loading-spinner"></div>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
  </div>

  <div class="calendar-legend">
    <div class="legend-item"><div class="legend-dot legend-dot--paid"></div><span>Pago</span></div>
    <div class="legend-item"><div class="legend-dot legend-dot--unpaid"></div><span>Em aberto</span></div>
    <div class="legend-item"><div class="legend-dot legend-dot--none"></div><span>Sem viagem</span></div>
  </div>

  <div class="month-stats">
    <div class="month-stat">
      <div class="month-stat__label">Viagens</div>
      <div id="month-total-trips" class="month-stat__value">0</div>
    </div>
    <div class="month-stat">
      <div class="month-stat__label">Pagas</div>
      <div id="month-paid-trips" class="month-stat__value" style="color:var(--paid)">0</div>
    </div>
    <div class="month-stat">
      <div class="month-stat__label">Em aberto</div>
      <div id="month-unpaid-trips" class="month-stat__value" style="color:var(--debt)">0</div>
    </div>
    <div class="month-stat month-stat--debt">
      <div class="month-stat__label">Dívida do mês</div>
      <div id="month-debt" class="month-stat__value">R$ 0,00</div>
    </div>
  </div>

  <p style="display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:.7rem;color:var(--text-muted);padding:0 1rem 1rem">
    <!-- Lucide: info -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:var(--text-muted);stroke-width:2;fill:none;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    Toque em qualquer dia para registrar ou remover uma viagem
  </p>
</div>
